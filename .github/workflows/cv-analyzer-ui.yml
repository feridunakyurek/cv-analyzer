name: CV Analyzer UI CI

on:
  push:
    paths:
      - 'cv-analyzer-ui/**'
  pull_request:
    paths:
      - 'cv-analyzer-ui/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: cv-analyzer-ui/package-lock.json

      - name: Install dependencies
        working-directory: cv-analyzer-ui
        run: npm ci --legacy-peer-deps

      - name: Build
        working-directory: cv-analyzer-ui
        run: npm run build