spring.application.name=cv-evaluation
server.error.include-message=always

# Veritabanı (MySQL) Ayarları
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.main.allow-circular-references=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Redis Ayarları
spring.data.redis.host=${SPRING_DATA_REDIS_HOST}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT}

JwtToken=${JwtToken}

GEMINI_API_KEY=${GEMINI_API_KEY}
spring.ai.openai.base-url=https://generativelanguage.googleapis.com/v1beta/openai
spring.ai.openai.chat.options.model=gemini-2.5-flash-lite

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=cv-analyzer-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Resilience4j Circuit Breaker
resilience4j.circuitbreaker.instances.geminiApi.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.geminiApi.slidingWindowSize=10
resilience4j.circuitbreaker.instances.geminiApi.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.geminiApi.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.geminiApi.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.geminiApi.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.geminiApi.failureRateThreshold=50
resilience4j.circuitbreaker.instances.geminiApi.eventConsumerBufferSize=10

# Resilience4j Retry
resilience4j.retry.instances.geminiApi.maxAttempts=2
resilience4j.retry.instances.geminiApi.waitDuration=500ms

# Resilience4j Timeout
resilience4j.timelimiter.instances.geminiApi.timeoutDuration=10s